[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ai-cli"
version = "0.1.0"
description = "Local-first terminal explanations in a Codex-style block timeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Terminal-AI-CLI contributors"}]
dependencies = []

[project.scripts]
terminal-ai = "terminal_ai.cli:main"

[tool.setuptools.packages.find]
include = ["terminal_ai*"]
